# Rebuilds the site on Vercel twice a day, so the prerendered "next match" moves on after each game even on days when
# nothing else changes (visitors' browsers also move it on from their own clock). Changes merged into main are
# published by Vercel itself; this is only for the quiet days. It can also be run by hand from the Actions tab.
#
# It uses the repository secret VERCEL_DEPLOY_HOOK, a Vercel deploy hook URL: in Vercel, project pickering-town-fc →
# Settings → Git → Deploy Hooks, create one for the main branch, then paste its URL into GitHub → Settings → Secrets
# and variables → Actions → New repository secret. Without it the rebuild is skipped with a warning.
name: Daily rebuild

on:
  schedule:
    - cron: "17 4 * * *" # daily, early morning
    # A second daily rebuild, in case GitHub drops the first (it skips scheduled runs when it's busy).
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::The VERCEL_DEPLOY_HOOK secret isn't set, so there's no daily rebuild (see the top of this workflow)."
            exit 0
          fi
          curl -fsS --retry 3 --max-time 30 -X POST "$HOOK" -o /dev/null -w "Vercel answered %{http_code}\n"
