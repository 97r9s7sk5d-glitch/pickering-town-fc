# Temporary: saves the NCEL live scores page so the live-score feature can be built against it. Removed afterwards.
name: Probe live scores page
on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-live.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          E="https://www.footballwebpages.co.uk/embed/northern-counties-east-league/vidiprinter?background-color=%2318197A&color=%23FFFFFF"
          try() { curl -sSL -A "$UA" --max-time 30 -H "Referer: $2" -o ".probe/$1" -w "$1 %{http_code} ref=$2 url=$3\n" "$3" >> .probe/index3.txt || echo "$1 FAILED" >> .probe/index3.txt; }
          try emb-ncel-ref-ncel.html "https://www.ncefl.org.uk/live/" "$E&origin=https%3A%2F%2Fwww.ncefl.org.uk&width=750"
          try emb-ncel-ref-pikes.html "https://www.pickeringtownfc.com/" "$E&origin=https%3A%2F%2Fwww.pickeringtownfc.com&width=750"
          try emb-team-ref-pikes.html "https://www.pickeringtownfc.com/" "https://www.footballwebpages.co.uk/embed/pickering-town/vidiprinter?origin=https%3A%2F%2Fwww.pickeringtownfc.com&width=750"
          try emb-team-fr-ref-pikes.html "https://www.pickeringtownfc.com/" "https://www.footballwebpages.co.uk/embed/pickering-town/fixtures-results?origin=https%3A%2F%2Fwww.pickeringtownfc.com&width=750"
          cat .probe/index3.txt; ls -la .probe | grep emb
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .probe
          git commit -m "Probe: Football Web Pages widget check (temporary)"
          git push
