# Temporary: is the live site served by Vercel with a valid certificate? Removed before the PR.
name: Probe live site

on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-live.yml]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in www.pickeringtownfc.com pickeringtownfc.com; do echo "$h -> $(dig +short $h | tr '\n' ' ')"; done
          echo "--- certificate"
          echo | openssl s_client -connect www.pickeringtownfc.com:443 -servername www.pickeringtownfc.com 2>/dev/null | openssl x509 -noout -issuer -subject -dates -ext subjectAltName || echo "no certificate"
          echo "--- addresses"
          for u in https://www.pickeringtownfc.com/ http://www.pickeringtownfc.com/ https://pickeringtownfc.com/ http://pickeringtownfc.com/ https://www.pickeringtownfc.com/teams https://www.pickeringtownfc.com/fixtures/ https://www.pickeringtownfc.com/no-such-page/; do
            curl -sS -o /dev/null --max-time 20 -w "$u -> %{http_code} %{redirect_url}\n" "$u" || echo "$u -> failed"
          done
          echo "--- headers"
          curl -sSI --max-time 20 https://www.pickeringtownfc.com/ | grep -i -E "^(http|server|strict-transport|x-vercel-id|x-frame|x-content)"
          echo "--- Redcar result on the live home page"
          curl -sS --max-time 20 https://www.pickeringtownfc.com/ | grep -o "Won 3–0 on penalties" | head -1
