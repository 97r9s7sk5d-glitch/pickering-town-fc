# Temporary: see what the live-score panels show during a game, in Chrome. Remove after use.
name: Probe live scores
on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-live.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pretend the next first-team game (f24) is at home and kicked off 20 minutes ago.
      - run: |
          node -e '
            const fs = require("fs"); const f = "src/content/fixtures.ts";
            const d = new Date(Date.now() - 20 * 60000), p = (n) => String(n).padStart(2, "0");
            const ko = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
            const s = fs.readFileSync(f, "utf8").replace(/id: "f24", kickoff: "[^"]+"(.*?)venue: "A"/, `id: "f24", kickoff: "${ko}"$1venue: "H"`);
            fs.writeFileSync(f, s); console.log(s.split("\n").find((l) => l.includes(`"f24"`)));'
          npm run build
      - run: |
          (cd dist/client && python3 -m http.server 4321 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p probe-shots
          cat > probe.mjs <<'JS'
          import { chromium } from "playwright-core";
          const browser = await chromium.launch({ channel: "chrome" });
          for (const [name, opts] of [["desktop", { viewport: { width: 1366, height: 900 } }], ["phone", { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, deviceScaleFactor: 2 }]]) {
            for (const path of ["/", "/matchday/"]) {
              const ctx = await browser.newContext(opts);
              const page = await ctx.newPage();
              const log = [];
              page.on("console", (m) => (m.type() === "error" || m.type() === "warning") && log.push(`console ${m.type()}: ${m.text().slice(0, 200)}`));
              page.on("pageerror", (e) => log.push(`pageerror: ${e.message.slice(0, 200)}`));
              page.on("requestfailed", (r) => log.push(`failed: ${r.url().slice(0, 120)} ${r.failure()?.errorText}`));
              page.on("response", (r) => r.url().includes("footballwebpages") && log.push(`fwp ${r.status()} ${r.url().slice(0, 140)}`));
              await page.goto(`http://localhost:4321${path}`, { waitUntil: "load" });
              await page.waitForTimeout(15000);
              console.log(`\n===== ${name} ${path}`);
              const live = page.locator("text=Live · Kicked off").first();
              console.log("live marker visible:", await live.isVisible().catch(() => false));
              for (const el of await page.locator(".fwp-embed").all()) {
                console.log("fwp-embed box:", JSON.stringify(await el.boundingBox()), "html:", (await el.innerHTML()).slice(0, 300));
              }
              for (const f of page.frames().slice(1)) {
                const fe = await f.frameElement().catch(() => null);
                const box = fe ? await fe.boundingBox() : null;
                const text = await f.locator("body").innerText({ timeout: 5000 }).catch((e) => `(unreadable: ${e.message.slice(0, 80)})`);
                console.log(`frame ${f.url().slice(0, 140)} box=${JSON.stringify(box)}\n  text: ${text.replace(/\s+/g, " ").slice(0, 600)}`);
              }
              for (const l of log) console.log(" ", l);
              const panel = page.locator(".fwp-embed").first();
              const target = (await panel.count()) ? panel.locator("xpath=ancestor::div[contains(@class,'rounded-3xl')][1]") : page.locator("main");
              await target.screenshot({ path: `probe-shots/${name}${path === "/" ? "-home" : "-matchday"}.png` }).catch((e) => console.log("screenshot failed", e.message));
              await ctx.close();
            }
          }
          // The feed page itself, as Football Web Pages shows it.
          const ctx = await browser.newContext({ viewport: { width: 800, height: 900 } });
          const page = await ctx.newPage();
          const res = await page.goto("https://www.footballwebpages.co.uk/pickering-town/vidiprinter", { waitUntil: "load" }).catch((e) => console.log("goto failed", e.message));
          await page.waitForTimeout(5000);
          console.log(`\n===== FWP vidiprinter page: status ${res?.status()}\n` + (await page.locator("body").innerText()).replace(/\s+/g, " ").slice(0, 1200));
          await page.screenshot({ path: "probe-shots/fwp-page.png" });
          await browser.close();
          JS
          cp probe.mjs ./probe-run.mjs && node probe-run.mjs
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- src/content/fixtures.ts
          git add probe-shots && git commit -qm "Temporary: live-score probe screenshots" && git push -q origin HEAD:${GITHUB_REF_NAME} || echo "no screenshots pushed"
