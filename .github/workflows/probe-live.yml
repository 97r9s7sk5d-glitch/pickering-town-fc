# Temporary: check the live-score panel against the real Football Web Pages feed. Remove after use.
name: Probe live scores
on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-live.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The next first-team game (f24) at home, kicking off 75 seconds after the build finishes.
      - run: |
          node -e '
            const fs = require("fs"); const f = "src/content/fixtures.ts";
            const d = new Date(Date.now() - 20 * 60000), p = (n) => String(n).padStart(2, "0");
            const ko = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
            fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace(/id: "f24", kickoff: "[^"]+"(.*?)venue: "A"/, `id: "f24", kickoff: "${ko}"$1venue: "H"`));
            fs.writeFileSync("kickoff.txt", ko); console.log("kick-off", ko);'
          npm run build
      - run: |
          (cd dist/client && python3 -m http.server 4321 >/dev/null 2>&1 &)
          sleep 2
          cat > probe-run.mjs <<'JS'
          import { chromium } from "playwright-core";
          const browser = await chromium.launch({ channel: "chrome" });
          for (const [name, opts] of [["desktop", { viewport: { width: 1366, height: 900 } }], ["phone", { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true }]]) {
            for (const path of ["/", "/matchday/"]) {
              const page = await browser.newPage(opts);
              const log = [];
              page.on("pageerror", (e) => log.push(`pageerror: ${e.message.slice(0, 200)}`));
              page.on("console", (m) => m.type() === "error" && log.push(`console error: ${m.text().slice(0, 160)}`));
              await page.goto(`http://localhost:4321${path}`, { waitUntil: "load" });
              await page.waitForTimeout(15000);
              const iframe = page.locator('iframe[title="Live match updates from Football Web Pages"]');
              console.log(`\n===== ${name} ${path}`);
              console.log("live marker:", await page.getByText("Live · Kicked off").first().isVisible());
              console.log("iframes:", await iframe.count(), "embed.js on page:", await page.locator('script[src*="embed.js"]').count());
              if (await iframe.count()) {
                console.log("box:", JSON.stringify(await iframe.boundingBox()), "style:", await iframe.getAttribute("style"));
                const f = await (await iframe.elementHandle()).contentFrame();
                console.log("feed text:", (await f.locator("body").innerText({ timeout: 5000 }).catch(() => "(unreadable)")).replace(/\s+/g, " ").slice(0, 200));
              }
              console.log("loading text visible:", await page.getByText("Loading live updates").isVisible().catch(() => false));
              console.log("fallback link visible:", await page.getByText("Live updates not showing?").isVisible().catch(() => false));
              for (const l of log) console.log(" ", l);
              await page.close();
            }
          }
          await browser.close();
          JS
          node probe-run.mjs
