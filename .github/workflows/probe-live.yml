# Temporary: saves the NCEL live scores page so the live-score feature can be built against it. Removed afterwards.
name: Probe live scores page
on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-live.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .probe
          UA="Mozilla/5.0 (compatible; PickeringTownFC-site/1.0; +https://www.pickeringtownfc.com)"
          F=https://www.footballwebpages.co.uk
          get() { curl -sSL -A "$UA" --max-time 30 -o ".probe/$1" -w "$1 %{http_code} %{url_effective}\n" "$2" >> .probe/index2.txt || echo "$1 FAILED" >> .probe/index2.txt; }
          get fwp-team.html "$F/pickering-town"
          get fwp-team-fr.html "$F/pickering-town/fixtures-results"
          get fwp-team-vidi.html "$F/pickering-town/vidiprinter"
          get fwp-embed-team-vidi.html "$F/embed/pickering-town/vidiprinter?origin=https%3A%2F%2Fwww.pickeringtownfc.com&width=600"
          get fwp-embed-team-vidi-0926.html "$F/embed/pickering-town/vidiprinter?date=2026-09-26&origin=https%3A%2F%2Fwww.pickeringtownfc.com&width=600"
          get fwp-embed-team-fr.html "$F/embed/pickering-town/fixtures-results?origin=https%3A%2F%2Fwww.pickeringtownfc.com&width=600"
          get fwp-embed-ncel-vidi-0926.html "$F/embed/northern-counties-east-league/vidiprinter?date=2026-09-26&origin=https%3A%2F%2Fwww.pickeringtownfc.com&width=600"
          get fwp-ncel-prem.html "$F/northern-counties-east-league-premier-division/fixtures-results"
          cat .probe/index2.txt; ls -la .probe
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .probe
          git commit -m "Probe: Football Web Pages snapshots (temporary)"
          git push
