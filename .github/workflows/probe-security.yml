# TEMPORARY: one-off look at the live site's HTTPS, redirects and security headers. Removed afterwards.
name: Probe security headers
on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-security.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.pickeringtownfc.com/ https://pickeringtownfc.com/ http://www.pickeringtownfc.com/ http://pickeringtownfc.com/ https://97r9s7sk5d-glitch.github.io/pickering-town-fc/ https://pickering-town-fc-draft.netlify.app/ https://pickering-town-fc.vercel.app/ https://www.pickeringtownfc.com/.git/config https://www.pickeringtownfc.com/package.json; do
            echo "===== $u"; curl -sS -o /dev/null -D - --max-time 20 "$u" | grep -i -E '^(HTTP|location|strict-transport|content-security|x-frame|x-content-type|referrer-policy|permissions-policy|server|cache-control|x-robots)' || echo "(no response)"
          done
          echo "===== TLS"; echo | openssl s_client -connect www.pickeringtownfc.com:443 -servername www.pickeringtownfc.com 2>/dev/null | openssl x509 -noout -issuer -subject -dates
          echo "===== DNS"; for n in pickeringtownfc.com www.pickeringtownfc.com; do dig +short A $n; dig +short CNAME $n; done; dig +short TXT pickeringtownfc.com; dig +short CAA pickeringtownfc.com; dig +short MX pickeringtownfc.com
