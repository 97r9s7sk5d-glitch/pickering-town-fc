# Checks the live site every hour and after every deploy (scripts/site-check.mjs): every page and linked file, each
# page in a real browser at desktop and phone sizes, missing first-team results, and failed results syncs or deploys.
# If it finds problems it opens an issue labelled "site-check" (GitHub emails the repository owner), comments on it
# when the problems change, and closes it once everything is clear again. The report is also on each run's summary.
# The run itself only fails if the check couldn't run, so a problem is emailed once (by the issue), not every hour.
name: Site check

on:
  schedule:
    - cron: "23 * * * *" # hourly
  # After each publish: Vercel marks the commit "Vercel: success" when a deploy of main is live. Its other updates
  # (deploys starting, previews of other branches) start a run whose job is skipped.
  status:
  # And by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: read
  issues: write

jobs:
  check:
    if: ${{ github.event_name != 'status' || (github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main')) }}
    # Here rather than for the whole workflow, so the skipped runs don't hold up or replace a waiting check.
    concurrency:
      group: site-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # After a deploy, give Vercel a few seconds to point the domain at it.
      - if: github.event_name == 'status'
        run: sleep 20
      - id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/site-check.mjs --report site-check.md
      - name: Open, update or close the site-check issue
        if: github.ref == 'refs/heads/main' && hashFiles('site-check.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
          SIGNATURE: ${{ steps.check.outputs.signature }}
        run: |
          gh label create site-check --color d93f0b --description "Problems found by the hourly site check" 2>/dev/null || true
          open=$(gh issue list --label site-check --state open --json number --jq '.[0].number // empty')
          if [ "$OUTCOME" = failure ]; then
            if [ -z "$open" ]; then
              gh issue create --title "Website problems found by the site check" --label site-check --body-file site-check.md
            elif ! gh issue view "$open" --json body --jq .body | grep -q "site-check:$SIGNATURE"; then
              # Different problems from last time: update the list and comment, so the change is emailed.
              gh issue edit "$open" --body-file site-check.md
              gh issue comment "$open" --body-file site-check.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "All clear: the site check found no problems ($(date -u '+%d %b %H:%M') UTC)."
          fi
      # Tells Bing (and the other IndexNow search engines) which pages exist straight after a change, so they recrawl
      # now rather than whenever they next call; DuckDuckGo, Yahoo and Ecosia use Bing's results. Google doesn't use
      # IndexNow (it reads the sitemap). The key is public by design: it's also the file /<key>.txt on the site, which
      # proves the site is ours. Skipped for the daily rebuild (a deploy of a commit more than 3 hours old), when nothing
      # has changed.
      - name: Tell Bing the pages changed (IndexNow)
        if: github.event_name == 'status'
        continue-on-error: true
        env:
          KEY: 5f5d602567ddd10608104943b5f6d1f0
          SITE: https://www.pickeringtownfc.com
          COMMITTED: ${{ github.event.commit.commit.committer.date }}
        run: |
          if [ $(( $(date +%s) - $(date -d "$COMMITTED" +%s) )) -gt 10800 ]; then echo "Nothing new to tell Bing."; exit 0; fi
          urls=$(curl -sS --max-time 30 "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          jq -n -c --arg key "$KEY" --arg site "$SITE" --argjson urls "$urls" \
            '{host: ($site | sub("https://"; "")), key: $key, keyLocation: "\($site)/\($key).txt", urlList: $urls}' > indexnow.json
          curl -sS --max-time 30 -o /dev/null -w "IndexNow answered %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
      - if: steps.check.outcome == 'failure'
        run: |
          if [ -f site-check.md ]; then
            echo "::warning::The site check found problems; see the summary and the site-check issue."
          else
            echo "::error::The site check couldn't run; see the check step's log."
            exit 1
          fi
