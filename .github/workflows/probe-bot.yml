# Temporary: does Vercel build commits made by github-actions[bot], as the results sync makes them? Removed before the PR.
name: Probe bot commit

on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-bot.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Probe: a commit by github-actions[bot], to see whether Vercel builds it"
          git push origin HEAD:claude/gallant-meitner-sqc5q9
          git log -1 --format=%H
