# Temporary: check the live site's certificate and how filtering DNS services answer for the domain. Remove after use.
name: Probe certificate
on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-cert.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in www.pickeringtownfc.com pickeringtownfc.com; do
            echo "=== Certificate $h"
            echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
            echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | grep "Verify return code" || true
          done
          echo "=== IPv6 certificate (www, GitHub's IPv6 addresses)"
          for ip in 2606:50c0:8000::153 2606:50c0:8001::153; do echo | timeout 10 openssl s_client -connect "[$ip]:443" -servername www.pickeringtownfc.com 2>&1 | grep -E "subject=|issuer=|Verify return|connect:|errno" | head -3 || true; done
          echo "=== DNS for www.pickeringtownfc.com from public and filtering resolvers"
          for r in "1.1.1.1 Cloudflare" "8.8.8.8 Google" "9.9.9.9 Quad9-malware" "1.1.1.2 Cloudflare-malware" "1.1.1.3 Cloudflare-family" "208.67.222.222 OpenDNS" "208.67.222.123 OpenDNS-FamilyShield" "185.228.168.9 CleanBrowsing-security" "185.228.168.168 CleanBrowsing-family" "94.140.14.14 AdGuard" "94.140.14.15 AdGuard-family"; do
            set -- $r
            echo "$2: www=$(dig +short +time=3 +tries=1 A www.pickeringtownfc.com @$1 | tr '\n' ' ') apex=$(dig +short +time=3 +tries=1 A pickeringtownfc.com @$1 | tr '\n' ' ')"
          done
          echo "=== Domain registration"
          whois pickeringtownfc.com 2>/dev/null | grep -iE "creation date|registry expiry|registrar:|status" | head -8 || echo "(whois unavailable)"
