# Temporary: check the live site's certificate the way Windows (and Edge) does. Remove after use.
name: Probe certificate
on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-cert.yml]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          foreach ($h in "www.pickeringtownfc.com", "pickeringtownfc.com") {
            "=== $h"
            try { $r = Invoke-WebRequest "https://$h/" -UseBasicParsing -MaximumRedirection 0 -SkipHttpErrorCheck; "HTTP $($r.StatusCode)" } catch { "FAILED: $($_.Exception.Message)" }
            $tcp = [Net.Sockets.TcpClient]::new($h, 443)
            $ssl = [Net.Security.SslStream]::new($tcp.GetStream(), $false, { param($s, $c, $ch, $e) "Windows policy errors: $e" | Out-Host; $true })
            $ssl.AuthenticateAsClient($h)
            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($ssl.RemoteCertificate)
            $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
            "Chain builds: $($chain.Build($cert))"
            $chain.ChainElements | ForEach-Object { "  $($_.Certificate.Subject)  (issuer: $($_.Certificate.Issuer))" }
            $chain.ChainStatus | ForEach-Object { "  status: $($_.Status) $($_.StatusInformation)" }
            $tcp.Close()
          }
