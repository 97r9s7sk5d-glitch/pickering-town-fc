# Builds the site and publishes it to GitHub Pages (www.pickeringtownfc.com) every time main changes, and once a day
# so the prerendered "next match" moves on after each game (browsers also move it on from their own clock).
# It can also be run by hand from the Actions tab ("Run workflow").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # daily, early morning
    # A second daily rebuild, in case GitHub drops the first (it skips scheduled runs when it's busy).
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer one waits rather than cancelling one that's halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Kick-off times in the content are UK time.
          TZ: Europe/London
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tells Bing (and the other IndexNow search engines) which pages exist straight after a change, so they recrawl
      # now rather than whenever they next call; DuckDuckGo, Yahoo and Ecosia use Bing's results. Google doesn't use
      # IndexNow (it reads the sitemap). The key is public by design: it's also the file /<key>.txt on the site, which
      # proves the site is ours. Skipped for the daily rebuild, when nothing has changed.
      - name: Tell Bing the pages changed (IndexNow)
        if: github.event_name != 'schedule'
        continue-on-error: true
        env:
          KEY: 5f5d602567ddd10608104943b5f6d1f0
          SITE: https://www.pickeringtownfc.com
        run: |
          sleep 30
          urls=$(curl -sS --max-time 30 "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          jq -n -c --arg key "$KEY" --arg site "$SITE" --argjson urls "$urls" \
            '{host: ($site | sub("https://"; "")), key: $key, keyLocation: "\($site)/\($key).txt", urlList: $urls}' > indexnow.json
          curl -sS --max-time 30 -o /dev/null -w "IndexNow answered %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
