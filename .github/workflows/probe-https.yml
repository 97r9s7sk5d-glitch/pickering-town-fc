# Temporary: is HTTPS forced on www.pickeringtownfc.com? Removed before the next PR.
name: Probe HTTPS

on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-https.yml]

permissions:
  pages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- GitHub Pages settings"
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{cname, https_enforced, https_certificate: .https_certificate.state, status}' || true
          for u in http://www.pickeringtownfc.com/ http://pickeringtownfc.com/ http://www.pickeringtownfc.com/teams/ https://pickeringtownfc.com/ https://www.pickeringtownfc.com/; do
            curl -sS -o /dev/null --max-time 20 -w "$u -> %{http_code} %{redirect_url}\n" "$u" || echo "$u -> failed"
          done
          echo "--- headers on https://www.pickeringtownfc.com/"
          curl -sSI --max-time 20 https://www.pickeringtownfc.com/ | grep -i -E "^(http|strict-transport|server|cache-control)"
