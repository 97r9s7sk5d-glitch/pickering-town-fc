# Temporary: see what the NCEL page serves to different GitHub machines. Remove after use.
name: Probe NCEL
on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-ncel.yml]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          cat > probe.mjs <<'JS'
          const ip = await fetch("https://api.ipify.org").then((r) => r.text()).catch(() => "?");
          for (const url of ["https://www.ncefl.org.uk/teams/pickeringtown/matches/2026/", "https://www.ncefl.org.uk/tables/"]) {
            const res = await fetch(url, { headers: { "User-Agent": "PickeringTownFC-website/1.0 (+https://www.pickeringtownfc.com)" } });
            const body = await res.text();
            const title = (/<title>([^<]*)/i.exec(body) || [])[1];
            const rows = (body.match(/<tr class="nomobile">/g) || []).length;
            const h = ["server", "cf-ray", "cf-mitigated", "x-cache", "content-type", "set-cookie"].map((k) => `${k}=${(res.headers.get(k) || "-").slice(0, 60)}`).join(" ");
            console.log(`ip=${ip} ${url} status=${res.status} bytes=${body.length} rows=${rows} title=${JSON.stringify(title)} ${h}`);
            if (rows === 0 && url.includes("matches")) console.log("BODY: " + body.replace(/\s+/g, " ").slice(0, 600));
          }
          JS
          node probe.mjs
