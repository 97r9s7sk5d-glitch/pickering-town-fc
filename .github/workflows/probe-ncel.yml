# TEMPORARY: saves what the NCEL's Pickering Town matches page serves now, to see why the sync read 0 games.
name: Probe NCEL page
on:
  push:
    branches: [claude/gallant-meitner-sqc5q9]
    paths: [.github/workflows/probe-ncel.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.ncefl.org.uk/teams/pickeringtown/matches/2026/ https://www.ncefl.org.uk/teams/pickeringtown/matches/ https://www.ncefl.org.uk/tables/; do
            echo "===== $u"
            curl -sS -L --max-time 30 -A "PickeringTownFC-website/1.0 (+https://www.pickeringtownfc.com)" -o p.html -w "final %{url_effective} %{http_code} %{size_download} bytes\n" "$u" || true
            grep -o -i '<title>[^<]*' p.html | head -1
            echo "rows nomobile: $(grep -c 'class="nomobile"' p.html)  tr: $(grep -c '<tr' p.html)  table: $(grep -c '<table' p.html)"
            grep -o -i -E 'cloudflare|captcha|maintenance|just a moment|access denied|cf-ray|challenge' p.html | sort | uniq -c | head
            sed -n '1,400p' p.html | grep -o '<tr[^>]*>' | sort | uniq -c | sort -rn | head -8
          done
